<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>HD PDF Compressor</title>
<meta name="viewport" content="width=device-width,initial-scale=1">

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0d0f1a;
  color:#fff;
  text-align:center;
}
.box{
  max-width:700px;
  margin:30px auto;
  background:#111522;
  padding:20px;
  border-radius:10px;
}
button{
  padding:10px 15px;
  background:#4862ff;
  border:none;
  color:#fff;
  border-radius:6px;
  cursor:pointer;
}
input[type=range]{width:250px}
.info{margin-top:10px;color:#9fb0ff}
</style>
</head>

<body>

<h2>HD PDF Compressor (No Blur)</h2>

<div class="box">

<input type="file" id="file" accept="application/pdf"><br><br>

<label>Quality: <b id="val">70%</b></label><br>
<input type="range" id="slider" min="40" max="100" value="70"><br>

<div id="size" class="info"></div>
<div id="estimate" class="info" style="color:#ffd580"></div>
<div id="newsize" class="info" style="color:#7fffb3"></div>

<br>
<button onclick="compress()">Compress PDF</button>

<div id="output" class="info"></div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script>
// worker fix
pdfjsLib.GlobalWorkerOptions.workerSrc =
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js";

let originalSize = 0;

// file select
document.getElementById("file").onchange = function(){
  const f = this.files[0];
  if(!f) return;

  originalSize = f.size;
  document.getElementById("size").innerHTML =
    "Original Size: " + format(originalSize);

  updateEstimate(); // 🔥 call on load
};

// slider change
document.getElementById("slider").oninput = function(){
  document.getElementById("val").innerText = this.value + "%";
  updateEstimate(); // 🔥 live update
};

// 🔥 NEW FUNCTION (estimate size)
function updateEstimate(){
  if(!originalSize) return;

  const percent = document.getElementById("slider").value;

  // smart formula (approximation)
  let estimated = originalSize * (percent / 100) * 0.9;

  document.getElementById("estimate").innerHTML =
    "Estimated Size: " + format(estimated);
}

// main compress
async function compress(){
  const file = document.getElementById("file").files[0];
  if(!file){ alert("Select PDF"); return; }

  const percent = document.getElementById("slider").value;
  const quality = percent / 100;

  document.getElementById("output").innerText = "Processing...";

  try{
    const pdf = await pdfjsLib.getDocument(URL.createObjectURL(file)).promise;
    const { jsPDF } = window.jspdf;

    const newPdf = new jsPDF();

    for(let i=1;i<=pdf.numPages;i++){
      const page = await pdf.getPage(i);

      const viewport = page.getViewport({ scale: 2 });

      const canvas = document.createElement("canvas");
      const ctx = canvas.getContext("2d");

      canvas.width = viewport.width;
      canvas.height = viewport.height;

      await page.render({canvasContext:ctx, viewport}).promise;

      let img;

      if(quality >= 0.8){
        img = canvas.toDataURL("image/png");
      }else{
        img = canvas.toDataURL("image/jpeg", quality);
      }

      const w = newPdf.internal.pageSize.getWidth();
      const h = (canvas.height * w) / canvas.width;

      if(i>1) newPdf.addPage();
      newPdf.addImage(img,"JPEG",0,0,w,h);
    }

    const blob = newPdf.output("blob");
    const url = URL.createObjectURL(blob);

    document.getElementById("output").innerHTML =
      `<a href="${url}" download="compressed.pdf">Download PDF</a>`;

    document.getElementById("newsize").innerHTML =
      "Final Size: " + format(blob.size);

  }catch(e){
    console.error(e);
    alert("Error processing PDF");
  }
}

// format
function format(bytes){
  let k=1024;
  let sizes=["Bytes","KB","MB"];
  let i=Math.floor(Math.log(bytes)/Math.log(k));
  return (bytes/Math.pow(k,i)).toFixed(2)+" "+sizes[i];
}
</script>

</body>
</html>
