<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>JPG → PDF Pro</title>

<style>
body{margin:0;font-family:Arial;background:#0d0f1a;color:#fff}
.header{padding:20px;font-size:24px;text-align:center}
.container{max-width:1000px;margin:auto;padding:20px}

.btn{
  padding:10px 15px;
  background:#4862ff;
  color:white;
  border:none;
  border-radius:6px;
  cursor:pointer;
}

.add-btn{
  width:40px;height:40px;
  border-radius:50%;
  font-size:22px;
  background:#24304f;
  color:#fff;
  border:none;
  cursor:pointer;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(140px,1fr));
  gap:10px;
  margin-top:15px;
}

.thumb{position:relative}
.thumb img{
  width:100%;
  height:100px;
  object-fit:cover;
  border-radius:6px;
}

.remove{
  position:absolute;
  top:5px;
  right:5px;
  background:red;
  color:white;
  border:none;
  border-radius:50%;
  width:25px;
  height:25px;
  cursor:pointer;
}

/* Count */
#count{
  margin-top:10px;
  color:#9fb0ff;
}

/* Loader */
#loader{
  display:none;
  position:fixed;
  top:0;left:0;
  width:100%;height:100%;
  background:rgba(0,0,0,0.85);
  z-index:9999;
  align-items:center;
  justify-content:center;
  flex-direction:column;
}

.bar{
  width:250px;
  height:10px;
  background:#222;
  border-radius:20px;
  margin-top:10px;
  overflow:hidden;
}

.fill{
  height:100%;
  width:0%;
  background:#4caf50;
}
</style>
</head>

<body>

<div class="header">JPG → PDF Converter</div>

<div class="container">

  <input type="file" id="mainInput" multiple accept="image/*" onchange="loadFiles(event)">
  
  <button class="add-btn" onclick="document.getElementById('addInput').click()">+</button>
  <input type="file" id="addInput" multiple accept="image/*" style="display:none" onchange="addMore(event)">

  <button class="btn" onclick="createPDF()">Create PDF</button>

  <!-- Total Count -->
  <div id="count">📸 Total Images: <b>0</b></div>

  <div id="gallery" class="grid"></div>

</div>

<!-- Loader -->
<div id="loader">
  <div>⏳ Processing PDF...</div>
  <div id="percent">0%</div>
  <div class="bar"><div class="fill" id="fill"></div></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script>
let items = [];

// Load first images
function loadFiles(e){
  const files = Array.from(e.target.files);
  items = [];
  files.forEach(file => processFile(file));
}

// Add more images
function addMore(e){
  const files = Array.from(e.target.files);
  files.forEach(file => processFile(file));
  e.target.value = "";
}

// Convert file to preview
function processFile(file){
  const reader = new FileReader();
  reader.onload = function(){
    items.push(reader.result);
    render();
  }
  reader.readAsDataURL(file);
}

// Remove image
function removeImage(index){
  items.splice(index,1);
  render();
}

// Render gallery
function render(){
  const g = document.getElementById("gallery");
  g.innerHTML = "";

  items.forEach((src,i)=>{
    const div = document.createElement("div");
    div.className = "thumb";

    div.innerHTML = `
      <button class="remove" onclick="removeImage(${i})">×</button>
      <img src="${src}">
    `;

    g.appendChild(div);
  });

  updateCount();
}

// Update count
function updateCount(){
  document.getElementById("count").innerHTML =
    "📸 Total Images: <b>" + items.length + "</b>";
}

// Loader
function showLoader(){
  document.getElementById("loader").style.display = "flex";
}
function hideLoader(){
  document.getElementById("loader").style.display = "none";
}
function updateProgress(p){
  document.getElementById("percent").innerText = p + "%";
  document.getElementById("fill").style.width = p + "%";
}

// Create PDF
async function createPDF(){
  if(items.length===0){
    alert("Select images first");
    return;
  }

  showLoader();

  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF();

  for(let i=0;i<items.length;i++){

    const img = new Image();
    img.src = items[i];

    await new Promise(res=>img.onload = res);

    const canvas = document.createElement("canvas");
    const ctx = canvas.getContext("2d");

    canvas.width = img.width * 0.7;
    canvas.height = img.height * 0.7;

    ctx.drawImage(img,0,0,canvas.width,canvas.height);

    const compressed = canvas.toDataURL("image/jpeg",0.8);

    const pageW = pdf.internal.pageSize.getWidth();
    const pageH = pdf.internal.pageSize.getHeight();

    pdf.addImage(compressed,"JPEG",10,10,pageW-20,pageH-20);

    if(i < items.length-1) pdf.addPage();

    let percent = Math.round(((i+1)/items.length)*100);
    updateProgress(percent);
  }

  pdf.save("images-to-pdf.pdf");

  setTimeout(()=>{
    hideLoader();
    updateProgress(0);
  },800);
}
</script>

</body>
</html>
